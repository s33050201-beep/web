<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <title>大樂透自動選號與對獎系統（Lotto）</title>

    <style>
      :root{
        --main: #4C4541;
        --primary: #AEAC78;
        --yellow: #F2C46A;
        --button: #A4BE7B;
        --white: #FCF0DA;
      }

      .split-container{
        display: grid;
        grid-template-columns: 50% 50%;
        flex: 1;
      }

      .left-side, .right-side {
        flex: 1; /* 兩邊均分畫面 (50/50) */
        padding: 20px;
      }

      body{
        min-width: 45%;
        background-color: var(--main);
        color: var(--white);
        display: flex;
        flex-direction: column;
      }

      footer{
        background-color: var(--white);
      }

      h3{
        font-size: 1.5rem;
        text-align: center;
        padding: 0;
      }

      p{
        font-size: 1.15rem;
        text-align: center;
      }

      button {
        background-color: var(--button);
        border: none;
        color: var(--white);
        padding: 8px 24px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        border-radius: 2rem;
        margin: 4px 2px;
        cursor: pointer;
      }

      .box {
        display: flex;
        flex-direction: column; 
        background-color: var(--primary);
        min-height: 35%;
        border-radius: 1rem;
        margin: 10px;
        padding: 5px 10px;
        overflow: hidden; 
        box-sizing: border-box; 
      }

      .box-top, .box-bottom {
        flex: 1;          /* 兩邊均分畫面 (50/50) */
        padding: 0;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center; 
      }

      .number-container{
        visibility: hidden;

        display: flex;
        flex: 1;
        gap: auto;
        align-items: center;
        justify-content: center;
        padding: 0.5rem 0;
        background-color: var(--white);
        border-radius: 0;
      }

      .ball {
        visibility: hidden;

        width: 2.7rem;
        height: 2.7rem;
        border-radius: 50%;
        aspect-ratio: 1 / 1;
        
        display: flex;
        align-items: center;
        justify-content: center;
  
        color: var(--white);
        background-color: var(--button);
        font-family: 'Arial', sans-serif;
        font-size: 1.5rem;
        font-weight: bold;
      }

      whole-container{
        margin: 0 auto;
        min-width: 50%;
        width: 800px;
      }
    </style>
    <script>
      function reflash(){
        for(let i = 1 ; i < 7 ; i++){
          //color
          document.getElementsByClassName('ball')[i-1].style.backgroundColor = 'var(--button)';
          document.getElementsByClassName('ball')[5+i].style.backgroundColor = 'var(--button)';
          document.getElementsByClassName('ball')[11+i].style.backgroundColor = 'var(--button)';
          
          //visibility
          document.getElementsByClassName('number-container')[2].style.visibility = 'hidden';
          document.getElementById('winning-ball' + i).style.visibility = 'hidden';
          }
        document.getElementById('result-text').innerText = '對獎結果';
        }
    </script>
  </head>

  
  <body>
    <div class="whole-container">
    <header>
        <h1 style="text-align: center;">🎰 資三乙李加薏_大樂透自動選號與對獎系統</h1>
    </header>

    <!-- 宣告全域變數，用來記錄玩家選號與開獎號碼 -->
    <script>
      let userNumbers = [];
      let winningNumbers = [];
    </script>

    <div class="split-container">
      <!-- LEFT SIDE -->
      <div class="left-side">

        <!-- 第一區塊：玩家選號區 -->
        <div class="box">
          <div class="box-top">
            <h3>彩券號碼</h3>
          </div>

          <!-- 按鈕點擊時，直接執行內嵌的 JavaScript 程式碼（不使用 custom function） -->
          <div class="box-bottom">
            <button onclick="
              userNumbers = [];
              //random
              while (userNumbers.length < 6) {
                let randNum = Math.floor(Math.random() * 49) + 1;
                if (!userNumbers.includes(randNum)) {
                  userNumbers.push(randNum);
                }
              }
              userNumbers.sort((a, b) => a - b);
              //balling
              //style ball
              reflash();
              for(let i = 1 ; i < 7 ; i++){
                document.getElementById('my-ball' + i).innerText = userNumbers[i-1];
                //visibility
                document.getElementById('my-ball' + i).style.visibility = 'visible';
              }
              document.getElementById('my-numbers').innerText = '我的號碼';
              document.getElementsByClassName('number-container')[0].style.visibility = 'visible';
            ">🎲 自動選號</button>
          </div>
        </div>

        <!-- 第二區塊：電腦開獎區 -->
        <div class="box">
          <div class="box-top">
            <h3>開獎號碼</h3>
          </div>

          <div class="box-bottom">
            <button onclick="
              winningNumbers = [];
              //random
              while (winningNumbers.length < 6) {
                let randNum = Math.floor(Math.random() * 49) + 1;
                if (!winningNumbers.includes(randNum)) {
                  winningNumbers.push(randNum);
                }
              }
              winningNumbers.sort((a, b) => a - b);
              //balling
              //style
              reflash();
              for(let i = 1 ; i < 7 ; i++){
                document.getElementById('draw-ball' + i).innerText = winningNumbers[i-1];
                //visibility
                document.getElementById('draw-ball' + i).style.visibility = 'visible';
              }
              document.getElementById('draw-numbers').innerText = '開獎號碼';
              document.getElementsByClassName('number-container')[1].style.visibility = 'visible';
            ">🎉 開始開獎</button>
          </div>
        </div>

        <!-- 第三區塊：對獎結果區 -->
        <div class="box">
          <div class="box-top">
            <h3>對獎結果</h3>
          </div>

          <div class="box-bottom">
            <button onclick="
              if (userNumbers.length === 0 || winningNumbers.length === 0) {
                alert('請先點擊「自動選號」與「開始開獎」！');
              }else {
                let matchCount = 0;
                reflash();
                for(let i = 0 ; i < userNumbers.length ; i++){
                  //indexOf: B[i] -> A[?] == B[i]
                  const indexInWin = winningNumbers.indexOf(userNumbers[i]);
                  if(indexInWin !== -1){
                    matchCount++;
                    //balling
                    //my-ball
                    document.getElementById('my-ball' + (i+1)).style.backgroundColor = 'var(--yellow)';
                    //draw-ball
                    document.getElementById('draw-ball' + (indexInWin+1)).style.backgroundColor = 'var(--yellow)';
                    //result-ball
                    document.getElementsByClassName('number-container')[2].style.visibility = 'visible';
                    document.getElementById('winning-ball' + (matchCount)).style.backgroundColor = 'var(--yellow)';
                    document.getElementById('winning-ball' + (matchCount)).innerText = userNumbers[i];
                    document.getElementById('winning-ball' + (matchCount)).style.visibility = 'visible';
                  }
                }
                let resultText = '對中 ' + matchCount + ' 個號碼！';
                // 更新到指定 id 的元素中
                document.getElementById('result-text').innerText = resultText;
              }
            ">🔍 進行對獎</button>
          </div>
        </div>
        
      </div>
      <!-- RIGHT SIDE -->
      <div class="right-side">
        <!-- 第一區 -->
        <div class="box">
          <div class="box-top">
            <p id="my-numbers">請點擊左方按鈕進行自動選號</p>
          </div>

          <!-- 彩券號碼 -->
          <div class="box-bottom">
            <div class="number-container">
              <div class="ball" id="my-ball1"></div>
              <div class="ball" id="my-ball2"></div>
              <div class="ball" id="my-ball3"></div>
              <div class="ball" id="my-ball4"></div>
              <div class="ball" id="my-ball5"></div>
              <div class="ball" id="my-ball6"></div>
            </div>
          </div>
        </div>

        <!-- 第二區 -->
        <div class="box">
          <div class="box-top">
            <p id="draw-numbers">等待開獎中...</p>
          </div>

          <!-- 開獎號碼 -->
          <div class="box-bottom">
            <div class="number-container">
              <div class="ball" id="draw-ball1"></div>
              <div class="ball" id="draw-ball2"></div>
              <div class="ball" id="draw-ball3"></div>
              <div class="ball" id="draw-ball4"></div>
              <div class="ball" id="draw-ball5"></div>
              <div class="ball" id="draw-ball6"></div>
            </div>
          </div>
        </div>

        <!-- 第三區 -->
        <div class="box">
          <div class="box-top">
            <!-- 顯示對獎結果 -->
            <p id="result-text" style="font-weight: bold;">對獎結果</p>
          </div>

          <!-- 顯示中獎號碼-->
          <div class="box-bottom">
            <div class="number-container">
              <div class="ball" id="winning-ball1"></div>
              <div class="ball" id="winning-ball2"></div>
              <div class="ball" id="winning-ball3"></div>
              <div class="ball" id="winning-ball4"></div>
              <div class="ball" id="winning-ball5"></div>
              <div class="ball" id="winning-ball6"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
    <div style="height: 100%;
                position: fixed;">
    </div>
    <footer style="width: 100%;
                    position: fixed;
                    bottom: 0;
                    height: 10%;">
        <button onclick="window.location.reload();"
                style="display: block;
                        margin: auto;
                        align-items: center;
                        height: 100%;
                        width: 100%;
                        border-radius: 0%;
                        padding: 0%;">🎲 重新開始</button>
    </footer>
  </body>
</html>
